<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Una pregunta para ti ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: 'Arial', sans-serif;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .message {
            display: none;
            font-size: 2em;
            color: #e63946;
            margin-top: 20px;
        }

        .heart {
            color: red;
            font-size: 2em;
        }
    </style>
</head>
<body>

    <div class="card" onclick="openCard()">
        💌 Haz clic para abrir la carta
        <div class="message" id="message">
            ¿Valentine? <span class="heart">❤️</span>
        </div>
    </div>

    <script>
        function openCard() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
