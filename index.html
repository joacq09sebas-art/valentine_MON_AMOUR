<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Una pregunta para ti 💙</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    text-align: center;
    cursor: pointer;
    transition: transform 0.3s ease;
    position: relative;
    z-index: 2;
}

.card:hover {
    transform: scale(1.05);
}

.message {
    display: none;
    font-size: 1.8em;
    color: #1e3a8a;
    margin-top: 20px;
}

button {
    display: none;
    margin-top: 20px;
    padding: 10px 25px;
    font-size: 1em;
    border: none;
    border-radius: 20px;
    background-color: #1e90ff;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: #0f5ec7;
}

.final-message {
    display: none;
    font-size: 2em;
    color: #0f172a;
    margin-top: 20px;
}

/* Corazones flotando */
.heart {
    position: absolute;
    color: #1e90ff;
    font-size: 20px;
    animation: floatUp 4s linear infinite;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-800px) scale(1.5);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="card" onclick="openCard()">
    💌 Tengo algo que preguntarte

    <div class="message" id="message">
        Valentine Ma Vie? 💙
    </div>

    <button id="yesBtn" onclick="showLove(event)">Sí</button>

    <div class="final-message" id="finalMessage">
        Otro San Valentín juntos 💙
    </div>
</div>

<script>
function openCard() {
    document.getElementById("message").style.display = "block";
    document.getElementById("yesBtn").style.display = "inline-block";
}

function showLove(event) {
    event.stopPropagation();

    document.getElementById("finalMessage").style.display = "block";

    for (let i = 0; i < 20; i++) {
        createHeart();
    }
}

function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💙";

    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.top = window.innerHeight + "px";
    heart.style.fontSize = (Math.random() * 20 + 15) + "px";
    heart.style.animationDuration = (Math.random() * 2 + 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 4000);
}
</script>

</body>
</html>
